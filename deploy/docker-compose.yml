services:
  web:
    extends:
      file: docker-compose.web.yml
      service: web

  caddy:
    image: ${CADDY_IMAGE:?Set CADDY_IMAGE to an immutable Caddy image digest}
    restart: unless-stopped
    environment:
      OPENQCA_DOMAIN: ${OPENQCA_DOMAIN:?Set OPENQCA_DOMAIN}
      CADDY_EMAIL: ${CADDY_EMAIL:?Set CADDY_EMAIL}
    depends_on:
      web:
        condition: service_healthy
    ports:
      - "80:80"
      - "443:443"
    volumes:
      - ./Caddyfile:/etc/caddy/Caddyfile:ro
      - caddy_data:/data
      - caddy_config:/config
    read_only: true
    tmpfs:
      - /tmp
    deploy:
      resources:
        limits:
          cpus: "0.5"
          memory: 256M

volumes:
  caddy_data:
  caddy_config:
